name: Update trophies

on:
  schedule:
    - cron: "17 3 * * *" # every day at 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/trophy.yml
      - trophy.ts

permissions:
  contents: write

jobs:
  trophy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ryo-ma/github-profile-trophy
          ref: 43736b50a82fca73c8df1c81abb40aa03519975c
          path: trophy-src

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Generate trophy SVG
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          cp trophy.ts trophy-src/trophy.ts
          cd trophy-src && deno run --allow-net --allow-env --allow-read --allow-write trophy.ts ${{ github.repository_owner }} ../assets/trophy.svg

      # Commit through the GitHub API instead of git push: GitHub signs API commits itself,
      # so they show as Verified.
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- assets/trophy.svg; then
            echo "No changes"
            exit 0
          fi
          sha=$(gh api "repos/$REPO/contents/assets/trophy.svg?ref=$BRANCH" --jq .sha)
          base64 -w0 assets/trophy.svg > "$RUNNER_TEMP/trophy.b64"
          gh api -X PUT "repos/$REPO/contents/assets/trophy.svg" \
            -f message="Update trophies" -f branch="$BRANCH" -f sha="$sha" \
            -F content=@"$RUNNER_TEMP/trophy.b64" --silent
