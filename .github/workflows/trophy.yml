name: Update trophies

on:
  schedule:
    - cron: "17 3 * * *" # every day at 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/trophy.yml
      - trophy.ts

permissions:
  contents: write

jobs:
  trophy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ryo-ma/github-profile-trophy
          ref: 43736b50a82fca73c8df1c81abb40aa03519975c
          path: trophy-src

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Generate trophy SVG
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          cp trophy.ts trophy-src/trophy.ts
          cd trophy-src && deno run --allow-net --allow-env --allow-read --allow-write trophy.ts ${{ github.repository_owner }} ../assets/trophy.svg

      - name: Commit if changed
        run: |
          git add assets/trophy.svg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update trophies"
            git push
          fi
